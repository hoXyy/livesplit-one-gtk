name: Rust

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'dev'
    tags:
      - '*'
    # Every push to main publishes an AppImage, which updaters then offer to users.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'PKGBUILD'
      - 'update-pkgver.sh'

# The colors mess with the problem matcher.
# env:
  # CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        label:
          - Linux x86_64
          - Linux x86_64-v3

        include:
          - label: Linux x86_64
            target: x86_64-unknown-linux-gnu
            features: auto-splitting

          - label: Linux x86_64-v3
            target: x86_64-unknown-linux-gnu
            target_rename: x86_64_v3-unknown-linux-gnu
            rust_flags: -C target-cpu=x86-64-v3
            features: auto-splitting

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: 'stable'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgtk-4-dev libadwaita-1-dev

      - name: Build
        run: bash .github/workflows/build.sh
        env:
          TARGET: ${{ matrix.target }}
          IS_DEPLOY: ${{ startsWith(github.ref, 'refs/tags/') }}
          FEATURES: ${{ matrix.features }}
          RUSTFLAGS: ${{ matrix.rust_flags }}

      - name: Prepare Release
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/workflows/before_deploy.sh
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TARGET: ${{ matrix.target_rename || matrix.target }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'pre') }}
          generate_release_notes: true
          files: livesplit-one-*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appimage:
    # Pinned: this sets the oldest glibc, GTK and libadwaita the AppImage works with.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # A newer push cancels the older build, so an older build can't finish last and
    # become the latest release.
    concurrency:
      group: appimage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
        with:
          # The commit count in the version needs the full history.
          fetch-depth: 0

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: 'stable'

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgtk-4-dev libadwaita-1-dev librsvg2-common adwaita-icon-theme dpkg-dev file pkg-config curl

      - name: Determine version
        id: version
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=$cargo_version-r$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: bash packaging/appimage/build.sh
        env:
          # Every commit gets built, which is too often for max-opt's full LTO.
          CARGO_PROFILE: release
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/appimage/livesplit-one-gtk-*.AppImage

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # Re-running a job for a commit that's already published changes nothing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already published"
            exit 0
          fi
          # --latest because GitHub otherwise goes by commit date, which a rebase can
          # make older. The commit message is included because generated notes
          # mostly list merged PRs.
          gh release create "$TAG" \
            target/appimage/livesplit-one-gtk-*.AppImage \
            target/appimage/livesplit-one-gtk-*.AppImage.zsync \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$(git log -1 --format=%B)" \
            --generate-notes \
            --latest

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          components: clippy

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgtk-4-dev libadwaita-1-dev

      - name: Run Clippy
        run: cargo clippy --all-features

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt -- --check || true
